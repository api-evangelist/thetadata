generated: '2026-07-22'
method: searched
status: published
source: https://docs.thetadata.us/Mcp/Getting-Started.html
description: 'ThetaData ships an official MCP (Model Context Protocol) server built into Theta Terminal
  v3, exposing the full v3 market-data API to LLM CLIs (documented for Claude CLI and Gemini CLI) over
  SSE at http://127.0.0.1:25503/mcp/sse. The server is local-only: it requires the Theta Terminal running
  on the user''s machine and a paid ThetaData subscription, so the live tools/list manifest cannot be
  introspected anonymously. The tool list below is a candidate list derived one-per-operationId from the
  published OpenAPI 3.1 spec, per the docs statement that the MCP server exposes the full v3 API; actual
  published tool names/schemas need authenticated local introspection. A community npm MCP server (thetadatadx-mcp-server,
  publisher userfrm) also exists.'
server:
  name: thetadata
  transport: sse
  url: http://127.0.0.1:25503/mcp/sse
  hosting: local (built into Theta Terminal v3)
  auth: Theta Terminal session (API key or account credentials at terminal launch); subscription required
  install:
    claude_cli: claude mcp add --transport sse ThetaData http://127.0.0.1:25503/mcp/sse
    gemini_cli: 'Add {"mcpServers": {"Theta Data": {"url": "http://127.0.0.1:25503/mcp/sse", "timeout":
      30000}}} to ~/.gemini/config.json'
community:
- name: thetadatadx-mcp-server
  registry: npm
  install: npx -y thetadatadx-mcp-server
  official: false
tools_status: candidate
