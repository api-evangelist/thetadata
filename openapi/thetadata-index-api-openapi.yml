              schema: *id020
components:
  parameters:
    start_date:
      name: start_date
      in: query
      description: The start date (inclusive).
      required: true
      schema:
        type: string
        format: date
    end_time:
      name: end_time
      in: query
      description: The end time (inclusive) in the specified day (format 24-hour HH:MM:SS.SSS).
      required: false
      schema:
        type: string
        format: time
        default: '16:00:00'
    date:
      name: date
      in: query
      description: The date to fetch data for.
      required: true
      schema:
        type: string
        format: date
    time_of_day:
      name: time_of_day
      in: query
      description: The time of the day to fetch data for; assumed to be America/New_York.
      required: true
      schema:
        type: string
        format: time
    opt_end_date:
      name: end_date
      in: query
      description: The end date (inclusive).
      required: false
      schema:
        type: string
        format: date
    start_time:
      name: start_time
      in: query
      description: The start time (inclusive) in the specified day (format 24-hour HH:MM:SS.SSS).
      required: false
      schema:
        type: string
        format: time
        default: 09:30:00
    single_symbol:
      name: symbol
      in: query
      description: The stock or index symbol, or underlying symbol for options.
      required: true
      schema:
        type: string
    opt_start_date:
      name: start_date
      in: query
      description: The start date (inclusive).
      required: false
      schema:
        type: string
        format: date
    format:
      name: format
      in: query
      description: The format of the data when returned to the user.
      required: false
      schema:
        type: string
        enum:
        - csv
        - json
        - ndjson
        - html
        default: csv
    min_time:
      name: min_time
      in: query
      description: Filters snapshots to include only data with a timestamp greater or equal to the specified value (HH:mm:ss.SSS format).
      required: false
      schema:
        type: string
        format: time
    end_date:
      name: end_date
      in: query
      description: The end date (inclusive).
      required: true
      schema:
        type: string
        format: date
    opt_date:
      name: date
      in: query
      description: The date to fetch data for. If present, this overrides start_date and end_date.
      required: false
      schema:
        type: string
        format: date
    interval:
      name: interval
      in: query
      description: The size of the time interval must be one of the available options listed below. Intervals less than 1m are available only for single-day requests.
      required: true
      schema:
        type: string
        enum:
        - tick
        - 10ms
        - 100ms
        - 500ms
        - 1s
        - 5s
        - 10s
        - 15s
        - 30s
        - 1m
        - 5m
        - 10m
        - 15m
        - 30m
        - 1h
        default: 1s
    multi_symbol:
      name: symbol
      in: query
      description: The stock or index symbol, or underlying symbol for options. Specify '*' for all symbols or a comma separated list when appropriate.
      required: true
      schema:
        type: array
        items:
          type: string
