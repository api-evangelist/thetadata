  /stock/history/trade_quote:
    x-concurrent-limit-ttl-ms: '1858'
    x-min-subscription: standard
    x-history-access: true
    get:
      summary: Trade Quote
      operationId: stock_history_trade_quote
      x-codeSamples:
      - lang: Python
        label: pandas
        source: 'from thetadata import ThetaClient


          client = ThetaClient(dataframe_type=''pandas'')

          df = client.stock_history_trade_quote(symbol=''AAPL'')

          '
      - lang: Python
        label: polars
        source: 'from thetadata import ThetaClient


          client = ThetaClient(dataframe_type=''polars'')

          df = client.stock_history_trade_quote(symbol=''AAPL'')

          '
      tags:
      - Stock
      description: 'Returns every trade reported by [UTP & CTA](/Articles/Data-And-Requests/The-SIPs) paired with the last BBO quote reported by [UTP or CTA](/Articles/Data-And-Requests/The-SIPs) at the time of trade. A quote is matched with a trade if its timestamp ``<=`` the trade timestamp. If you prefer to match quotes with timestamps that are ``<`` the trade timestamp, specify the ``exclusive`` parameter to ``true``. Set the ``venue`` parameter to ``nqb`` to access current-day real-time historic data from the [Nasdaq Basic feed](/Articles/Data-And-Requests/The-SIPs) if the account has a [stocks standard or pro subscription](https://www.thetadata.net/subscribe.html#stocks).

        - Multi-day requests are limited to 1 month of data.

        '
      x-sample-urls:
