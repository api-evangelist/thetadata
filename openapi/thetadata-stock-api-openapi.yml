        - 10ms
        - 100ms
        - 500ms
        - 1s
        - 5s
        - 10s
        - 15s
        - 30s
        - 1m
        - 5m
        - 10m
        - 15m
        - 30m
        - 1h
        default: 1s
    request_type:
