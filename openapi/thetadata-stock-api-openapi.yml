components:
  parameters:
    start_date:
      name: start_date
      in: query
      description: The start date (inclusive).
      required: true
      schema:
        type: string
        format: date
    end_time:
      name: end_time
      in: query
      description: The end time (inclusive) in the specified day (format 24-hour HH:MM:SS.SSS).
      required: false
      schema:
        type: string
        format: time
        default: '16:00:00'
    date:
      name: date
      in: query
      description: The date to fetch data for.
      required: true
      schema:
        type: string
        format: date
    time_of_day:
      name: time_of_day
      in: query
      description: The time of the day to fetch data for; assumed to be America/New_York.
      required: true
      schema:
        type: string
        format: time
    opt_end_date:
      name: end_date
      in: query
      description: The end date (inclusive).
      required: false
      schema:
        type: string
        format: date
    start_time:
      name: start_time
      in: query
      description: The start time (inclusive) in the specified day (format 24-hour HH:MM:SS.SSS).
      required: false
      schema:
        type: string
        format: time
        default: 09:30:00
    exclusive:
      name: exclusive
      in: query
      description: If you prefer to match quotes with timestamps that are < the trade timestamp.
      required: false
      schema:
        type: boolean
        default: true
    single_symbol:
      name: symbol
      in: query
      description: The stock or index symbol, or underlying symbol for options.
      required: true
      schema:
        type: string
    opt_start_date:
      name: start_date
      in: query
      description: The start date (inclusive).
      required: false
      schema:
        type: string
        format: date
    venue:
      name: venue
      in: query
      description: Used to specify the venue of the real time or historic request. ``nqb`` = Nasdaq Basic; ``utp_cta`` = merged UTP & CTA.
      required: false
      schema:
        type: string
        enum:
        - nqb
        - utp_cta
        default: nqb
    end_date:
      name: end_date
      in: query
      description: The end date (inclusive).
      required: true
      schema:
        type: string
        format: date
    min_time:
      name: min_time
      in: query
      description: Filters snapshots to include only data with a timestamp greater or equal to the specified value (HH:mm:ss.SSS format).
      required: false
      schema:
        type: string
        format: time
    format:
      name: format
      in: query
      description: The format of the data when returned to the user.
      required: false
      schema:
        type: string
        enum:
        - csv
        - json
        - ndjson
        - html
        default: csv
    opt_date:
      name: date
      in: query
      description: The date to fetch data for. If present, this overrides start_date and end_date.
      required: false
      schema:
        type: string
        format: date
    interval:
      name: interval
      in: query
      description: The size of the time interval must be one of the available options listed below. Intervals less than 1m are available only for single-day requests.
