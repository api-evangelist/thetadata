components:
  parameters:
    expiration_no_star:
      name: expiration
      in: query
      description: The expiration of the contract in `YYYY-MM-DD` or `YYYYMMDD` format.
      required: true
      schema:
        type: string
        format: date
    right:
      name: right
      in: query
      description: The right (call or put) of the contract.
      required: false
      schema:
        type: string
        enum:
        - call
        - put
        - both
        default: both
    date:
      name: date
      in: query
      description: The date to fetch data for.
      required: true
      schema:
        type: string
        format: date
    max_dte:
      name: max_dte
      in: query
      description: If specified, only contracts with a full calendar day 'Days to Expiration' (DTE) less than or equal to this number will be returned.
      required: false
      schema:
        minimum: 0
        type: integer
        format: int32
    strike:
      name: strike
      in: query
      description: The strike price of the contract in dollars (ie `100.00` for `$100.00`), or `*` for all strikes.
      required: false
      schema:
        type: string
        default: '*'
    single_symbol:
      name: symbol
      in: query
      description: The stock or index symbol, or underlying symbol for options.
      required: true
      schema:
        type: string
    format:
      name: format
      in: query
      description: The format of the data when returned to the user.
      required: false
      schema:
        type: string
        enum:
        - csv
        - json
        - ndjson
        - html
        default: csv
    opt_multi_symbol:
      name: symbol
      in: query
      description: The stock or index symbol, or underlying symbol for options.
      required: false
      schema:
        type: array
        items:
          type: string
    request_type:
      name: request_type
      in: path
      description: The request type.
      required: true
      schema:
        type: string
        enum:
        - trade
        - quote
    multi_symbol:
      name: symbol
      in: query
      description: The stock or index symbol, or underlying symbol for options. Specify '*' for all symbols or a comma separated list when appropriate.
      required: true
      schema:
        type: array
        items:
          type: string
