apis:
- aid: thetadata:thetadata-streaming-websocket-api
  name: ThetaData Streaming WebSocket API
  tags:
  - Streaming
  - WebSocket
  - Trades
  - Quotes
  - Real-Time
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.thetadata.us/Streaming/Getting-Started.html
  baseURL: ws://127.0.0.1:25520/v1/events
  properties:
  - url: https://docs.thetadata.us/Streaming/Getting-Started.html
    type: Documentation
  - type: AsyncAPI
    url: asyncapi/thetadata-streaming-asyncapi.yml
  description: JSON WebSocket streaming of US stock trade/quote, options trade/quote, and index price
    streams, served locally by the Theta Terminal at ws://127.0.0.1:25520/v1/events. Requires a paid subscription
    with streaming permissions; a single connection per user is permitted, with CONNECTED/DISCONNECTED
    status headers and QUOTE/TRADE/STATUS message types.
- aid: thetadata:thetadata-mcp-server
  name: ThetaData MCP Server
  tags:
  - MCP
  - Agents
  - SSE
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.thetadata.us/Mcp/Getting-Started.html
  baseURL: http://127.0.0.1:25503/mcp/sse
  properties:
  - url: https://docs.thetadata.us/Mcp/Getting-Started.html
    type: Documentation
  - type: MCPServer
    url: mcp/thetadata-mcp.yml
  - type: ToolCrosswalk
    url: mcp/thetadata-tool-crosswalk.yml
  description: Model Context Protocol server built into Theta Terminal v3, exposing the full v3 API to
    LLM CLIs (documented for Claude CLI and Gemini CLI) over SSE at http://127.0.0.1:25503/mcp/sse. Requires
    the terminal running locally and a valid ThetaData subscription.
