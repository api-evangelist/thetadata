aid: thetadata
url: https://raw.githubusercontent.com/api-evangelist/thetadata/refs/heads/main/apis.yml
name: ThetaData
kind: company
description: ThetaData is a developer-first US market data vendor founded in 2022 by Bailey Danseglio,
  selling real-time and historical options, stocks, indices, and interest-rates data with unfiltered tick-level
  trades, quotes, and Greeks. Delivery is self-serve via the Theta Terminal, a local Java application
  that authenticates with an API key or account credentials and exposes a local REST API (127.0.0.1:25503/v3),
  a WebSocket streaming API (127.0.0.1:25520), and an MCP server, backed by a published OpenAPI 3.1 spec,
  Python library, flat files, and tiered monthly subscriptions.
accessModel:
  pricing: freemium
  onboarding: self-service
  trial: true
  try_now: true
  public: true
  label: Freemium, self-service signup
  confidence: high
  source:
  - https://thetadata.net/pricing
  - https://docs.thetadata.us/Articles/Getting-Started/Subscriptions.html
  - https://docs.thetadata.us/Articles/Getting-Started/Sample-Data.html
  generated: '2026-07-22'
  method: searched
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/thetadata.png
tags:
- Financial
- Market Data
- Options
- Stocks
- Indices
- Real-Time
