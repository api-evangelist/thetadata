aid: thetadata
url: https://raw.githubusercontent.com/api-evangelist/thetadata/refs/heads/main/apis.yml
name: ThetaData
kind: company
description: ThetaData is a developer-first US market data vendor founded in 2022 by
  Bailey Danseglio, selling real-time and historical options, stocks, indices, and
  interest-rates data with unfiltered tick-level trades, quotes, and Greeks. Delivery
  is self-serve via the Theta Terminal, a local Java application that authenticates
  with an API key or account credentials and exposes a local REST API (127.0.0.1:25503/v3),
  a WebSocket streaming API (127.0.0.1:25520), and an MCP server, backed by a published
  OpenAPI 3.1 spec, Python library, flat files, and tiered monthly subscriptions.
