actions:
  openapiPath: openapi/thetadata-v3-openapi.yml
  apisYmlUpdated: true
  reason: |
    Bootstrap review. Three real documented API surfaces (v3 REST, WebSocket
    streaming, MCP over SSE) were cataloged, all served by the local Theta
    Terminal rather than hosted endpoints, and the public OpenAPI 3.1 spec
    was harvested verbatim with provenance recorded above. No specs were
    fabricated; the streaming API has no public AsyncAPI document.
